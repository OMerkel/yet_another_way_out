[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yet-another-way-out"
version = "0.1.0"
description = "Yet Another Way Out - Python implementation"
requires-python = ">=3.14"
dependencies = ["pygame-ce>=2.5.8"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "coverage>=7.17",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["way_out_game"]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.coverage.run]
branch = true
source = ["way_out_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=way_out_game --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pylint.main]
py-version = "3.14"
extension-pkg-allow-list = ["pygame"]

[tool.pylint.format]
max-line-length = 79
